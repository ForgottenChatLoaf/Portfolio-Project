<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#a89eff"/>
    </linearGradient>
    <!-- Glow gradient for the border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a89eff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Clip to rounded rect -->
    <clipPath id="roundClip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Subtle grid overlay -->
  <g clip-path="url(#roundClip)" opacity="0.12">
    <line x1="0" y1="25" x2="100" y2="25" stroke="white" stroke-width="1"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="75" x2="100" y2="75" stroke="white" stroke-width="1"/>
    <line x1="25" y1="0" x2="25" y2="100" stroke="white" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="white" stroke-width="1"/>
    <line x1="75" y1="0" x2="75" y2="100" stroke="white" stroke-width="1"/>
  </g>

  <!-- Glowing inner border -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- < bracket -->
  <text x="9" y="62" font-family="monospace, Courier New, sans-serif"
        font-size="30" font-weight="bold" fill="white" opacity="0.55">&lt;</text>

  <!-- E/ main text -->
  <text x="50" y="67" font-family="monospace, Courier New, sans-serif"
        font-size="38" font-weight="bold" fill="white"
        text-anchor="middle" dominant-baseline="auto">E/</text>

  <!-- > bracket -->
  <text x="76" y="62" font-family="monospace, Courier New, sans-serif"
        font-size="30" font-weight="bold" fill="white" opacity="0.55">&gt;</text>

  <!-- Small accent dot bottom-right -->
  <circle cx="82" cy="82" r="5" fill="white" opacity="0.25"/>
  <circle cx="82" cy="82" r="2.5" fill="#a89eff"/>
</svg>
