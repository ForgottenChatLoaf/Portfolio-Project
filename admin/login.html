<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Ethan Gacud Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <main class="admin-login-wrapper">
    <div class="admin-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <span class="section-eyebrow">Restricted Access</span>
        <h1 style="font-size: 1.8rem; margin-top: 6px;">Admin Sign In</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 6px;">Manage database contact messages</p>
      </div>

      <div class="form-feedback form-error-box" id="loginErrorBox" style="margin-bottom: 20px; display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">Invalid username or password.</span>
      </div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="adminUsername"><i class="fa-solid fa-user"></i> Admin Username</label>
          <input type="text" id="adminUsername" name="username" placeholder="Username" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="adminPassword"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn-primary" id="loginSubmitBtn" style="width: 100%; justify-content: center;">
            Sign In <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px;">
        <a href="../index.html" class="link-btn" style="color: var(--text-muted); font-size: 13px;">
          <i class="fa-solid fa-arrow-left"></i> Return to Public Portfolio
        </a>
      </div>
    </div>
  </main>

  <script src="../assets/js/admin.js"></script>
</body>
</html>
